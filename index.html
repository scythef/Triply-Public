<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Triply</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #f8f9fa;
      color: #212529;
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }

    .logo {
      font-size: 3rem;
      font-weight: 800;
      color: #1a73e8;
      letter-spacing: -1px;
      margin-bottom: 0.5rem;
    }

    .tagline {
      font-size: 1.1rem;
      color: #6c757d;
      margin-bottom: 2.5rem;
    }

    nav a {
      display: inline-block;
      margin: 0.4rem 0.8rem;
      color: #1a73e8;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      border-bottom: 2px solid transparent;
      transition: border-color 0.2s;
    }

    nav a:hover { border-color: #1a73e8; }

    footer {
      position: fixed;
      bottom: 1rem;
      font-size: 0.8rem;
      color: #adb5bd;
    }
  </style>
</head>
<body>

  <div class="logo">Triply</div>
  <p class="tagline">Your smart travel companion</p>

  <nav>
    <a href="privacy-policy.html">Privacy Policy</a>
  </nav>

  <footer>&copy; 2026 Triply. All rights reserved.</footer>

</body>
</html>
